# TranslateMe Custom Multilingual Transformer Configuration
project_name: "TranslateMe"
experiment_name: "from_scratch_multilingual_transformer"

# Custom Transformer Architecture (Vaswani et al., 2017)
model:
  architecture: "Seq2SeqTransformer"
  d_model: 256
  n_heads: 4
  num_encoder_layers: 3
  num_decoder_layers: 3
  d_ff: 1024
  dropout: 0.1
  share_embeddings: true
  vocab_size: 2000
  languages: ["en", "hi", "ta", "te"]
  control_tokens: ["<2en>", "<2hi>", "<2ta>", "<2te>"]
  max_seq_len: 128

# Dataset & Partitioning
dataset:
  name: "multilingual_indic_english_corpus"
  raw_dir: "ml_lab/datasets/raw"
  processed_dir: "ml_lab/datasets/processed"
  train_split: 0.8
  val_split: 0.1
  test_split: 0.1
  unicode_nfc: true
  max_ratio: 2.5

# Training Hyperparameters
training:
  output_dir: "ml_lab/checkpoints"
  checkpoint_name: "custom_multilingual_transformer.pt"
  tokenizer_path: "ml_lab/tokenizer/multilingual_tokenizer.json"
  epochs: 40
  batch_size: 8
  learning_rate: 0.004
  optimizer: "AdamW"
  beta1: 0.9
  beta2: 0.98
  eps: 1.0e-9
  weight_decay: 0.01
  grad_clip: 1.0
  label_smoothing: 0.1
  warmup_steps: 50
  scheduler: "Noam"
  seed: 42
