version: '3.8'

services:
  translateme:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: translateme_app
    ports:
      - "8000:8000"
    environment:
      - PORT=8000
      - HOST=0.0.0.0
      - MODEL_NAME=TranslateMe-Custom-Multilingual-Transformer
    volumes:
      - ./lingua_ai.db:/app/lingua_ai.db
      - ./ml_lab/checkpoints:/app/ml_lab/checkpoints
    restart: unless-stopped
